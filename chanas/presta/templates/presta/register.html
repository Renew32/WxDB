<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | Chanas Assurances</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0033a0;
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .login-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: whitesmoke;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            text-align: center;
        }

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin-bottom: 20px;
        }
        .logo img {
            width: 60px;
            height: 60px;
            background-color: #1f3c88;
            padding: 10px;
            border-radius: 5px;
        }
        .logo h3 {
            margin-top: 10px;
            color: black;
            font-weight: bold;
        }
        .form-control {
            border-radius: 5px;
        }
        .btn-primary {
            background-color: #1f3c88;
            border: none;
            border-radius: 5px;
        }
        .btn-primary:hover {
            background-color: #162c6d;
        }
        .error-message {
            color: red;
            font-size: 14px;
        }
        #text{
            color: black;
        }
        .footer{
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }
        
    </style>
</head>

{% load static %}

<body>

    <div class="login-container">
        <div class="logo">
            <img src="{% static '/img/chanas.png' %}" alt="Logo">
            <h3>Chanas Assurances S.A.</h3>
        </div>

        {% if messages %}
            {% for message in messages %}
                <p class="error-message">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3" id="text">
                <label for="username" class="form-label">Nom d'utilisateur</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3" id="text">
                <label for="email" class="form-label">Adresse email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3" id="text">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="mb-3" id="text">
                <label for="password_confirm" class="form-label">Confirmer le mot de passe</label>
                <input type="password" class="form-control" id="password_confirm" name="password_confirm" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="text">S'inscrire</button>
        </form>

        <p class="text-center mt-3" id="text">
            Déjà un compte ? <a href="{% url 'login' %}">Connectez-vous ici</a>
        </p>
    </div>

    <div class="footer">
        ©2025 - CHANAS V1.0 By Antoine Missoup Konga
    </div>

</body>
</html>
